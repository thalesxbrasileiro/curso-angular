<!-- 
#f="ngForm" = Referencia o formulário no template através da direticva ngForm e permite acessar seus controles e valores do formulário
(ngSubmit) = Dispara a função onSubmit passando o formulário como argumento
name = Define o nome do controle no formulário
ngModel = Liga o input ao formulário e permite acessar seu valor 

É preciso importar o FormsModule no módulo da aplicação para que essas diretivas funcionem corretamente.
-->
<!-- 
form-control:	Classe de estilo do Bootstrap.
ng-untouched/ng-touched	O campo ainda não perdeu o foco / já perdeu o foco.
ng-pristine/ng-dirty:	O valor ainda não foi alterado / foi alterado pelo usuário.
ng-valid/ng-invalid:	O valor atende / não atende às validações.
-->

<form #f="ngForm" (ngSubmit)="onSubmit(f)">
  <div class="form-group mb-3">
    <label for="nome" class="form-label">Nome</label>
    <input type="text" class="form-control" name="nome" id="nome" placeholder="Nome" [ngModel]="usuario.nome" 
    required minlength="3" #nome="ngModel">
    <!-- <div>
      {{ nome.className }}
    </div> -->
    <div *ngIf="nome.invalid && nome.touched" class="alert theme-danger" role="alert">
      Nome é obrigatório e deve ter pelo menos 3 caracteres.
    </div>
  </div>

  <div class="form-group mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" name="email" id="email" placeholder="nome@email.com" [ngModel]="usuario.email" required email #email="ngModel">
    <div *ngIf="email.invalid && email.touched" class="alert theme-danger" role="alert">
      Email é obrigatório e deve ser válido.
    </div>
  </div>
  
  <button type="submit" class="btn-solid theme-primary" [disabled]="f.invalid">Submit</button>

  <app-form-debug [form]="f"></app-form-debug>
</form>
