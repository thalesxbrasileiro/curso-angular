<!-- 
#f="ngForm" = Referencia o formulário no template através da direticva ngForm e permite acessar seus controles e valores do formulário
(ngSubmit) = Dispara a função onSubmit passando o formulário como argumento
name = Define o nome do controle no formulário
ngModel = Liga o input ao formulário e permite acessar seu valor 

É preciso importar o FormsModule no módulo da aplicação para que essas diretivas funcionem corretamente.
-->
<!-- 
form-control:	Classe de estilo do Bootstrap.
ng-untouched/ng-touched	O campo ainda não perdeu o foco / já perdeu o foco.
ng-pristine/ng-dirty:	O valor ainda não foi alterado / foi alterado pelo usuário.
ng-valid/ng-invalid:	O valor atende / não atende às validações.

No Input, podemos usar tando [class.is-invalid] quanto [ngClass] para aplicar classes condicionalmente: 
  Exemplo: [class.is-invalid]="campo.invalid && campo.touched"
  Exemplo: [ngClass]="aplicaCssErro(campo)"
-->

<form #f="ngForm" (ngSubmit)="onSubmit(f)">
  <div class="form-group mb-3">
    <label for="nome" class="form-label">Nome</label>

    <input type="text" class="form-control" id="nome" placeholder="Nome" 
      name="nome" [ngModel]="usuario.nome" #nome="ngModel" 
      required minlength="3"
      [ngClass]="aplicaCssErro(nome)">
    <!-- <div>
      {{ nome.className }}
    </div> -->

    <!-- Usando o componente de erro personalizado -->
    <app-campo-control-erro 
      [mostrarErro]="verificaValidTouched(nome)"
      msgErro="Nome é obrigatório e deve ter pelo menos 3 caracteres">
    </app-campo-control-erro>
  </div>

  <div class="form-group mb-3">
    <label for="email" class="form-label">Email</label>
    
    <input type="email" class="form-control" id="email" placeholder="nome@email.com"
      name="email" [ngModel]="usuario.email" #email="ngModel" 
      required email
      [class.is-invalid]="email.invalid && email.touched">
    
    <div *ngIf="email.invalid && email.touched" class="invalid-feedback">
      Email é obrigatório e deve ser válido
    </div>
  </div>

  <div ngModelGroup="endereco">

    <div class="row">
      <div class="col-3">
        <label for="cep" class="form-label">CEP</label>

        <input type="text" class="form-control" id="cep" 
          name="cep" ngModel #cep="ngModel" 
          required
          [class.is-invalid]="cep.invalid && cep.touched"
          (blur)="consultaCEP($event.target.value, f)">

        <div *ngIf="cep.invalid && cep.touched" class="invalid-feedback">
          CEP é obrigatório
        </div>
      </div>

      <div class="col-3">
        <label for="numero" class="form-label">Número</label>

        <input type="text" class="form-control" id="numero" 
          name="numero" ngModel #numero="ngModel" 
          required
          [class.is-invalid]="numero.invalid && numero.touched">

        <div *ngIf="numero.invalid && numero.touched" class="invalid-feedback">
          Número é obrigatório
        </div>
      </div>

      <div class="col-6">
        <label for="complemento" class="form-label">Complemento</label>
        
        <input type="text" class="form-control" id="complemento" 
          name="complemento" ngModel>
      </div>
    </div>

    <div class="form-group mt-3">
      <label for="rua" class="form-label">Rua</label>
      
      <input type="text" class="form-control" id="rua"
        name="rua" ngModel #rua="ngModel" 
        required> 
    </div>

    <div class="row mt-3">
      <div class="col-5">
        <label for="bairro" class="form-label">Bairro</label>
        
        <input type="text" class="form-control" id="bairro" 
          name="bairro" ngModel #bairro="ngModel" 
          required
          [class.is-invalid]="bairro.invalid && bairro.touched">
        
        <div *ngIf="bairro.invalid && bairro.touched" class="invalid-feedback">
          Bairro é obrigatório
        </div>
      </div>

      <div class="col-4">
        <label for="cidade" class="form-label">Cidade</label>
        
        <input type="text" class="form-control" id="cidade" 
          name="cidade" ngModel #cidade="ngModel" 
          required
          [class.is-invalid]="cidade.invalid && cidade.touched">
        
        <div *ngIf="cidade.invalid && cidade.touched" class="invalid-feedback">
          Cidade é obrigatório
        </div>
      </div>

      <div class="col-3">
        <label for="estado" class="form-label">Estado</label>
        
        <input type="text" class="form-control" id="estado" 
          name="estado" ngModel #estado="ngModel" 
          required
          [class.is-invalid]="estado.invalid && estado.touched">
        
        <div *ngIf="estado.invalid && estado.touched" class="invalid-feedback">
          Estado é obrigatório
        </div>
      </div>
    </div>

  </div>

  <button type="submit" class="btn-solid theme-primary mt-3" [disabled]="f.invalid">Submit</button>

  <app-form-debug [form]="f"></app-form-debug>
</form>
