<div class="row">
    <div class="col-sm">
        <h5>Lista de Alunos</h5>

        <div class="list-group">
            <a class="list-group-item list-group-item-action" aria-current="true" *ngFor="let aluno of alunos"
                [routerLink]="[aluno.id]">
                {{ aluno.nome }}
            </a>
        </div>  
    </div>

    <div class="col-sm">
        <router-outlet></router-outlet>
    </div>
</div>
