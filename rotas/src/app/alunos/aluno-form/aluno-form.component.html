<h5>Criar/Editar Aluno</h5>

<form>
<div class="form-group">
    <label>ID</label>
    <input [(ngModel)]="aluno.id" name="id" type="text" class="form-control" disabled>
</div>
<div class="form-group">
    <label>Nome</label>
    <input [(ngModel)]="aluno.nome" name="nome" type="text" class="form-control">
</div>
<div class="form-group">
    <label>Email</label>
    <input [(ngModel)]="aluno.email" name="email" type="email" class="form-control">
</div>
</form>
